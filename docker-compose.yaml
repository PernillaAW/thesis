  services:
    start:
      cpuset: "4"
      container_name: start
      build:
        context: .
        dockerfile: Dockerfile.dev
      env_file: 
        - ".env"
      ports:
        - "3000:3000" 
      volumes:
        - .:/data
        - ./:/app
        - /app/node_modules
        - /var/run/dbus:/var/run/dbus
      #depends_on:
        #postgres:
          #condition: service_healthy
    postgres:
      cpuset: "0-3"
      profiles: ["postgres"]
      container_name: postgres
      image: postgres:16
      env_file: 
        - ".env"
      ports:
        - "5432:5432"
      volumes:
        - .:/data
        - pgdata:/var/lib/postgresql/data
        - ./sql/postgreeSQLtables.sql:/docker-entrypoint-initdb.d/init_db.sql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 3s
        retries: 5

    oracle:
      cpuset: "0-3"
      profiles: ["oracle"]
      container_name: oracle
      image: gvenzl/oracle-xe:21-slim
      environment:
        ORACLE_PASSWORD: password
        APP_USER: app
        APP_USER_PASSWORD: app
      ports:
        - "1521:1521"
      volumes:
        - .:/data
        - oracledb:/opt/oracle/oradata
        - ./sql/oracle:/container-entrypoint-initdb.d
      healthcheck:
        test: ["CMD", "healthcheck.sh"]
        interval: 10s
        timeout: 5s
        retries: 10

    postgis:
      cpuset: "0-3"
      profiles: ["postgis"]
      container_name: postgis
      image: postgis/postgis:13-3.5
      env_file: ".env"
      ports:
        - "5433:5432"
      volumes:
        - .:/data
        - postgisdata:/var/lib/postgresql/data
        - ./sql/postGIStables.sql:/docker-entrypoint-initdb.d/init_db.sql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 3s
        retries: 5

    mongodb:
      profiles: ["mongodb"]
      container_name: mongodb
      image: mongo:4.2.3-bionic
      env_file: 
        - ".env"
      ports:
        - "27017:27017"
      volumes:
        - .:/data
        - mongodbdata:/data/db
        - ../nosql/mongodb.js:/docker-entrypoint-initdb.d
      healthcheck:
        test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
        interval: 5s
        timeout: 3s
        retries: 5

    cassandra:
      profiles: ["cassandra"]
      container_name: cassandra
      image: cassandra:5.0.6
      cpuset: "0-3"
      env_file: ".env"
      ports:
        - "9042:9042"
      volumes:
        - .:/data
        - cassandradata:/var/lib/cassandra
    cassandra-load-keyspace:
      profiles: ["cassandra"]
      container_name: cassandra-load-keyspace
      image: cassandra:latest
      depends_on:
        - cassandra
      volumes:
        - ./nosql/cassandra.cql:/schema.cql
      command: /bin/bash -c "sleep 160 && echo loading cassandra keyspace && cqlsh cassandra -f /schema.cql"

    couchbase:
      profiles: ["couchbase"]
      container_name: couchbase
      image: couchbase:enterprise-8.0.0
      env_file: 
        - ".env"
      ports:
        - "8091:8091"
        - "11210:11210"
      volumes:
        - .:/data
        - couchbasedata:/opt/couchbase/var
      ulimits:
        nofile:
          soft: 65536
          hard: 65536
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8091/pools"]
        interval: 10s
        timeout: 5s
        retries: 15
        start_period: 60s
        
    couchbase-init:
      profiles: ["couchbase"]
      image: couchbase:enterprise-8.0.0
      depends_on:
        couchbase:
          condition: service_healthy
      env_file: 
        - ".env"
      volumes:
        - ./couchbase-init.sh:/init.sh
      entrypoint: ["/bin/bash", "/init.sh"]


  volumes:
    pgdata: {}
    oracledb: {}
    postgisdata: {}
    mongodbdata: {}
    cassandradata: {}
    couchbasedata: {}
